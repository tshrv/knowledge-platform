[project]
name = "knowledge-platform"
version = "0.1.0"
description = "A production-grade RAG and agent platform for document ingestion, enrichment, hybrid retrieval, reranking, reasoning, evaluation, and observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.2.0",
    "aiobotocore>=2.15.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "markitdown[pdf]>=0.1.8",
    "qdrant-client>=1.13.0",
    "motor>=3.7.0",
    "pymongo>=4.11.0",
    "google-genai>=2.25.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "boto3-stubs[s3]>=1.35.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "markitdown.*",
    "motor.*",
]
ignore_missing_imports = true

